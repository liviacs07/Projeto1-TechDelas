<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechDelas - Login e Cadastro</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&family=Roboto:wght@400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-body">

    <div class="login-container">
        <div class="login-header">
            <a href="index.html" class="voltar-home">Voltar para a Página Principal</a>
            <h1>Junte-se ao TechDelas</h1>
            <p>Cadastre-se para ter acesso completo aos cursos de programação.</p>
        </div>

        <!-- Formulário contendo mais de 5 campos + e-mail + senha -->
        <form action="index.html" method="GET" class="login-form">
            
            <!-- Campo 1 -->
            <div class="form-group">
                <label for="nome">Nome Completo:</label>
                <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo" required>
            </div>

            <!-- Campo 2: E-mail (Exigência do enunciado) -->
            <div class="form-group">
                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" placeholder="seu-email@exemplo.com" required>
            </div>

            <!-- Campo 3: Senha (Exigência do enunciado) -->
            <div class="form-group">
                <label for="senha">Senha:</label>
                <input type="password" id="senha" name="senha" placeholder="Crie uma senha segura" required>
            </div>

            <!-- Campo 4 -->
            <div class="form-group">
                <label for="telefone">Telefone / WhatsApp:</label>
                <input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000">
            </div>

            <!-- Campo 5 -->
            <div class="form-group">
                <label for="interesse">Área de Principal Interesse:</label>
                <select id="interesse" name="interesse" required>
                    <option value="">Selecione...</option>
                    <option value="html">Front-End (HTML/CSS)</option>
                    <option value="js">Lógica e JavaScript</option>
                    <option value="geral">Carreira em Tecnologia</option>
                </select>
            </div>

            <!-- Botão de envio direcionando para a página principal -->
            <button type="submit" class="btn-enviar">Criar Conta e Acessar</button>
        </form>
    </div>

</body>
</html>
